services:
  hugo:
    image: hugomods/hugo:0.161.1
    # Hugo writes public/, resources/ and .hugo_build.lock straight into the
    # bind mount; as root those land root-owned on the host. HOME must point
    # somewhere writable, as the host uid has no home inside the image.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /src/site
    volumes:
      - .:/src:delegated
    command: ["server", "--bind", "0.0.0.0", "--port", "1313", "--baseURL", "http://localhost:1313/", "--appendPort=false", "--disableFastRender", "--buildDrafts", "--buildFuture"]
    ports:
      - "${HUGO_PORT:-1313}:1313"

  hugo-rules:
    image: hugomods/hugo:0.161.1
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /src/site-rules
    volumes:
      - .:/src:delegated
    command: ["server", "--bind", "0.0.0.0", "--port", "1313", "--baseURL", "http://localhost:1314/", "--appendPort=false", "--disableFastRender", "--buildDrafts", "--buildFuture"]
    ports:
      - "${HUGO_RULES_PORT:-1314}:1313"
